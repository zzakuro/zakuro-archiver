# uc-archiver.
#
#   docker compose up -d
#   open http://127.0.0.1:8073
#
# One container, because there is one program. It used to run a Surge sidecar
# beside it, declared through SURGE_HOST and SURGE_TOKEN, and nothing ever read
# them: a download manager that was never wired to anything, described in the
# Dockerfile as though it were. The measurements said it was not wanted either --
# aria2, a mature independent implementation, matched the built-in downloader to
# within noise on the same file and the same machine, and the limiter that
# matters is per share and per IP rather than per client. So the built-in
# downloader stands on its own, and the container gains no dependency for it.

services:
  uc-archiver:
    build: .
    # The catalogue to work from. Mount your own, or drop one in the image.
    volumes:
      - ./catalogue.json:/work/catalogue.json:ro
      - ./out:/work/out
      # Downloads and unpacked folders are big and throwaway; keep them off the
      # writable layer so they can be a different volume or a tmpfs.
      - work:/work/tmp
    environment:
      # Inside the container the page has to bind 0.0.0.0 to be reachable, but
      # it is only *published* on the host's loopback below. That keeps an
      # unauthenticated way to start downloads off the network.
      UC_HOST: "0.0.0.0"
      UC_TOKEN: "${UC_TOKEN:?set UC_TOKEN in .env, or the page has no auth}"
      # What a single download would like, and what the process may have at
      # once across every job. The second is the one that matters when several
      # run together, because the host's limit is per IP.
      UC_CONNECTIONS: "8"
      UC_TOTAL_CONNECTIONS: "8"
      # rar is proprietary and not in the image. 7-Zip reads the .7z shares and
      # writes .7z output; mount a rar and point --archiver at it for .rar.
    command: ["--serve", "--port", "8073", "--work-dir", "/work/tmp",
              "--output-dir", "/work/out", "/work/catalogue.json"]
    ports:
      # 127.0.0.1 on the host, not 0.0.0.0. Change this only if you have put a
      # token in front of it and know what that means.
      - "127.0.0.1:8073:8073"
    restart: unless-stopped

volumes:
  work:

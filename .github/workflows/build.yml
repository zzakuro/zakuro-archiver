name: build

# A prebuilt image, so deploying is `docker compose pull` rather than a build
# on whatever machine happens to be serving. Triggered by hand and by pushes to
# main, and only when something that goes into the image has changed -- the
# tests, the browser fetch and the browser download are the slow parts and none
# of them are affected by a README edit.

on:
  push:
    branches: [main]
    paths:
      - "uc_archiver.py"
      - "parallel.py"
      - "jobs.py"
      - "webapp.py"
      - "selftest.py"
      - "testserver.py"
      - "requirements.txt"
      - "Dockerfile"
      - "static/**"
      - "profiles/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The checks before the image. They need no network and no archiver, so
      # this is the cheap gate, and it is the same suite that runs locally.
      - name: the checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scrapling[all]>=0.4.15"
          python selftest.py

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A pushed image that cannot start is worse than no image, and the two
      # things that fail silently here are the browser (the whole tool rests on
      # it) and the healthcheck. So it is run, not assumed.
      #
      # The container is found by service rather than by name: compose derives
      # the project name from the directory, so a hardcoded
      # `<project>-uc-archiver-1` is a guess that is wrong on any runner whose
      # checkout directory is not named after the service.
      - name: it starts, and the browser is there
        env:
          # compose refuses to start without this, and the point is to prove the
          # page comes up, not that this token is any good.
          UC_TOKEN: ci-smoke-test-not-a-real-token
        run: |
          # compose bind-mounts a catalogue, a redist folder and a readme, and
          # none of them is in the repository. Docker would create the missing
          # ones as *directories*, which is not what a file mount should be, so
          # stand-ins are made first. Nothing reads them here -- the point is
          # that the container starts and the browser works.
          mkdir -p redist out
          : > ReadME.txt
          printf '{"name": "ci", "downloads": []}' > catalogue.json
          docker compose up -d
          cid=$(docker compose ps -q uc-archiver)
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
            [ "$state" = healthy ] && break
            [ "$state" = unhealthy ] && docker compose logs && exit 1
            sleep 10
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' "$cid")" = healthy ] \
            || { docker compose logs; exit 1; }
          docker compose exec -T uc-archiver python -c \
            "import sys, uc_archiver as u; sys.exit(1 if u.scrapling_problem() else 0)"
          docker compose down

name: build

# A prebuilt image, so deploying is `docker compose pull` rather than a build
# on whatever machine happens to be serving. Triggered by hand and by pushes to
# main, and only when something that goes into the image has changed -- the
# tests, the browser fetch and the browser download are the slow parts and none
# of them are affected by a README edit.

on:
  push:
    branches: [main]
    paths:
      - "uc_archiver.py"
      - "parallel.py"
      - "jobs.py"
      - "webapp.py"
      - "selftest.py"
      - "testserver.py"
      - "requirements.txt"
      - "Dockerfile"
      - "static/**"
      - "profiles/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The checks before the image. They need no network and no archiver, so
      # this is the cheap gate, and it is the same suite that runs locally.
      - name: the checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scrapling[all]>=0.4.15"
          python selftest.py

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A pushed image that cannot start is worse than no image, and the two
      # things that fail silently here are the browser (the whole tool rests on
      # it) and the healthcheck. So it is run, not assumed.
      - name: it starts, and the browser is there
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' \
                    uc-archiver-uc-archiver-1 2>/dev/null || echo starting)
            [ "$state" = healthy ] && break
            [ "$state" = unhealthy ] && docker compose logs && exit 1
            sleep 10
          done
          docker compose exec -T uc-archiver python -c \
            "import sys, uc_archiver as u; sys.exit(1 if u.scrapling_problem() else 0)"
          docker compose down
